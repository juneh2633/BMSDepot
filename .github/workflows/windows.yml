name: Windows build and release draft
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build Windows packages
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          $version = '0.1.0-alpha.2'
          if ($env:RELEASE_REF.StartsWith('refs/tags/v')) { $version = $env:RELEASE_NAME.Substring(1) }
          ./next/Build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: artifacts/release/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-files
      - name: Create prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-files -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --prerelease --title "BMS Depot $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
